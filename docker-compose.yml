services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gaius
    ports:
      # Host 5433 evita conflito com Postgres instalado no Windows (geralmente na 5432).
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d gaius']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gaius?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-string}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
